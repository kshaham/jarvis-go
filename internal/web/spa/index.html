<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03140e" />
    <title>Jarvis · Office (React)</title>
    <!-- Fonts are self-hosted via @fontsource-variable (imported in
         main.tsx) so the Go-embedded build works offline and the exact
         "Inter Variable" / "JetBrains Mono Variable" family names in
         tokens.css resolve. No external font CDN. -->
    <!-- No-flash theme: apply the stored/system theme before first paint
         so light mode never flashes dark on load (mirrors useTheme). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('office-theme') || 'system';
          if (p === 'blue') {
            document.documentElement.setAttribute('data-theme', 'blue');
          } else {
            var light =
              p === 'light' ||
              (p === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
            if (light) document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
