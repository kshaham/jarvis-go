<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Jarvis - Setup Password</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M20 6h-7v2h5v12a4 4 0 01-4 4H12' stroke='url(%23g)' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='24' r='2' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='6' r='1.5' fill='%2360a5fa' opacity='.6'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .setup-container {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
    }
    .setup-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .setup-brand h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #60a5fa;
      letter-spacing: -0.02em;
    }
    .setup-brand p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.5rem;
    }
    .setup-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus {
      border-color: #3b82f6;
    }
    .form-group .hint {
      font-size: 0.7rem;
      color: #555;
      margin-top: 0.3rem;
    }
    .btn-setup {
      width: 100%;
      padding: 0.65rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }
    .btn-setup:hover { background: #2563eb; }
    .btn-setup:disabled {
      background: #1e3a5f;
      color: #6b7280;
      cursor: not-allowed;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="setup-brand">
      <h1>Jarvis</h1>
      <p>Set a password to protect your instance</p>
    </div>
    <div class="setup-card">
      <div class="error-msg" id="errorMsg"></div>
      <form id="setupForm" autocomplete="on">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="new-password" autocomplete="new-password" required autofocus>
          <div class="hint">Minimum 8 characters</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirm-password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-setup" id="submitBtn">Set Password</button>
      </form>
    </div>
  </div>
  <script>
    (function() {
      const form = document.getElementById('setupForm');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (password.length < 8) {
          showError('Password must be at least 8 characters.');
          return;
        }

        if (password.length > 128) {
          showError('Password must be at most 128 characters.');
          return;
        }

        if (password !== confirm) {
          showError('Passwords do not match.');
          confirmInput.value = '';
          confirmInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Setting up...';

        try {
          const res = await fetch('/api/auth/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/';
            return;
          }

          showError(data.error || 'Setup failed. Please try again.');
        } catch (err) {
          showError('Connection error. Please try again.');
        }

        submitBtn.disabled = false;
        submitBtn.textContent = 'Set Password';
      });
    })();
  </script>
</body>
</html>
