<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06080C">
  <title>Jarvis - Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M20 6h-7v2h5v12a4 4 0 01-4 4H12' stroke='url(%23g)' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='24' r='2' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='6' r='1.5' fill='%2360a5fa' opacity='.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-app: #06080C;
      --text-primary: #FFFFFF;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --text-faint: #7F8C9E;
      --accent: #94A3B8;
      --accent-hi: #CBD5E1;
      --grad-hero: linear-gradient(to right bottom, #53617A, #3A445C);
      --border-default: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --glass-blur: 24px;
      --motion-fast: 150ms;
      --motion-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ui-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--ui-stack);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Full-bleed dot-matrix ambient field — same pattern as the office dashboard. */
    #ambientBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 18% 8%, rgba(83, 97, 122, 0.22), transparent 55%),
        radial-gradient(circle at 82% 92%, rgba(58, 68, 92, 0.28), transparent 55%),
        radial-gradient(circle, rgba(148, 163, 184, 0.10) 1px, transparent 1.4px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-position: 0 0, 0 0, 0 0;
      animation: ambientDrift 120s linear infinite;
    }
    @keyframes ambientDrift { to { background-position: 0 0, 0 0, 100px 100px; } }
    @media (prefers-reduced-motion: reduce) { #ambientBg { animation: none; } }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .login-brand { text-align: center; margin-bottom: 2rem; }
    .login-brand h1 {
      font-size: 36px;
      font-weight: 600;
      line-height: 40px;
      letter-spacing: -0.025em;
      color: var(--accent);
    }
    .login-brand p {
      font-size: 11px;
      font-weight: 400;
      line-height: 16.5px;
      color: var(--text-faint);
      margin-top: 0.5rem;
    }

    /* Gradient border shell — signature DESIGN.md hero edge treatment.
     * Double-background paints the slate hairline via border-box while the
     * glass fill sits inside padding-box. */
    .login-card {
      background:
        linear-gradient(rgba(16, 21, 31, 0.92), rgba(16, 21, 31, 0.92)) padding-box,
        var(--grad-hero) border-box;
      border: 1px solid transparent;
      border-radius: 24px;
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                  0 8px 10px -6px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--ui-stack);
      font-size: 14px;
      font-weight: 400;
      outline: none;
      transition: border-color var(--motion-fast) var(--motion-ease),
                  background var(--motion-fast) var(--motion-ease),
                  box-shadow var(--motion-fast) var(--motion-ease);
    }
    .form-group input::placeholder { color: var(--text-faint); }
    .form-group input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.35);
    }

    .btn-login {
      width: 100%;
      padding: 0.7rem;
      background: var(--grad-hero);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      font-family: var(--ui-stack);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: filter var(--motion-fast) var(--motion-ease),
                  border-color var(--motion-fast) var(--motion-ease);
      margin-top: 0.5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    .btn-login:hover {
      filter: brightness(1.1);
      border-color: rgba(255, 255, 255, 0.28);
    }
    .btn-login:disabled {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-faint);
      border-color: var(--border-default);
      cursor: not-allowed;
      filter: none;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 11px;
      font-weight: 400;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div id="ambientBg" aria-hidden="true"></div>
  <div class="login-container">
    <div class="login-brand">
      <h1>Jarvis</h1>
      <p>Enter your password to continue</p>
    </div>
    <div class="login-card">
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit" class="btn-login" id="submitBtn">Log in</button>
      </form>
    </div>
  </div>
  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      let countdownTimer = null;

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function startCountdown(retryAfterMs) {
        submitBtn.disabled = true;
        let remaining = Math.ceil(retryAfterMs / 1000);

        function tick() {
          if (remaining <= 0) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log in';
            hideError();
            return;
          }
          const mins = Math.floor(remaining / 60);
          const secs = remaining % 60;
          const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          showError(`Too many failed attempts. Try again in ${timeStr}.`);
          submitBtn.textContent = `Locked (${timeStr})`;
          remaining--;
        }

        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const password = passwordInput.value;
        if (!password) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/';
            return;
          }

          if (data.retryAfterMs) {
            startCountdown(data.retryAfterMs);
          } else {
            showError(data.error || 'Invalid password');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log in';
          }
        } catch (err) {
          showError('Connection error. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log in';
        }

        passwordInput.value = '';
        passwordInput.focus();
      });
    })();
  </script>
</body>
</html>
